[package]
name = "adb-manager"
version = "0.1.0"
description = "ADB Manager — Premium Windows Android ADB Management & Debugging Suite"
edition = "2021"
rust-version = "1.77"

[lib]
name = "adb_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "adb-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
